configuration:
  otlp_endpoint:
    name: OTLP endpoint
    description: Base OTLP/HTTP URL of your backend, without a signal path, e.g. https://otlp.example.com or http://192.0.2.10:4318. Required.
  otlp_protocol:
    name: OTLP protocol
    description: http (OTLP/HTTP, port 4318 by default) or grpc (OTLP/gRPC, port 4317 by default).
  otlp_headers:
    name: OTLP headers
    description: Request headers sent to the backend, usually the auth token (e.g. Authorization). Values are hidden here but stored in plain text in backups.
  otlp_tls_insecure_skip_verify:
    name: Skip TLS verification
    description: Accept any server certificate (self-signed). Only for testing; prefer a CA file.
  otlp_ca_file:
    name: CA certificate file
    description: A CA certificate in the Home Assistant ssl folder to trust, e.g. my-ca.pem.
  service_name:
    name: service.name
    description: service.name of Home Assistant Core and service.namespace of every signal (the Supervisor, add-ons and the host get their own service.name).
  service_instance_id:
    name: service.instance.id
    description: Optional resource attribute, e.g. homeassistant.local:8123.
  deployment_environment:
    name: deployment.environment.name
    description: Resource attribute set on every signal, e.g. home or homelab.
  resource_attributes:
    name: Extra resource attributes
    description: Additional name/value resource attributes. They override the ones above if the name is the same.
  logs:
    name: Logs
    description: Send the Home Assistant OS system journal (host, kernel, Supervisor, Core, add-ons).
  logs_min_priority:
    name: Journal pre-filter
    description: Keep at info. Containers log stdout as info and stderr as err, so a stricter value drops whole containers. Use Minimum severity instead.
  logs_min_severity:
    name: Minimum severity
    description: Drop log records below this severity, after parsing. Use this to reduce log volume.
  logs_multiline:
    name: Join tracebacks
    description: Send a Python traceback from a container as one log record instead of one per line.
  logs_parse:
    name: Parse log lines
    description: Turn JSON and Python log lines into attributes (thread.name, python.logger.name) and keep only the message as body.
  ha_metrics:
    name: Home Assistant metrics
    description: Scrape /api/prometheus through the Supervisor. Needs the prometheus integration; Entity metrics covers the same data without it.
  ha_traces:
    name: Automation traces
    description: Send every finished automation and script run as a trace, one span per step.
  host_metrics:
    name: Host metrics
    description: CPU, memory, load, paging, network, data disk and uptime of the machine.
  container_metrics:
    name: Container metrics
    description: CPU, memory, disk and network of Home Assistant Core, the Supervisor and every started add-on.
  entity_metrics:
    name: Entity metrics
    description: Every entity state as a metric, with device, area and floor. No Prometheus integration needed.
  entity_metrics_attributes:
    name: Entity attribute metrics
    description: Also send numeric entity attributes (current temperature, brightness, battery level...) as metrics.
  entity_metrics_attribute_exclude:
    name: Excluded entity attributes
    description: Attribute names left out of the attribute metrics (wildcards work). The defaults skip static configuration and GPS positions (latitude, longitude...) for privacy.
  entity_metrics_exclude:
    name: Excluded entities
    description: Entity ids to leave out of entity metrics. Wildcards work, e.g. sensor.*_linkquality.
  event_logs:
    name: Event logs
    description: Send Home Assistant events (call_service, automation_triggered...) as logs, linked to the automation trace that caused them.
  event_logs_exclude:
    name: Excluded event types
    description: Event types not sent as logs. state_changed is excluded by default because entity metrics cover states.
  core_logs:
    name: Structured Core logs
    description: Install the bundled OTel Logs integration and send Home Assistant's logs structured (code, exception, logger) and linked to the automation trace that wrote them. Restart Home Assistant once after enabling.
  health_sensors:
    name: Health sensors
    description: Publish the add-on's export health in Home Assistant (exported items, failures, queue usage, status).
  profiles:
    name: Profiles (experimental)
    description: Install the bundled OTel Profiler integration and send profiles of Home Assistant. Restart Home Assistant once after enabling. Needs a backend that accepts OTLP profiles.
  scrape_interval:
    name: Scrape interval
    description: How often Home Assistant and host metrics are collected, e.g. 60s or 1m.
