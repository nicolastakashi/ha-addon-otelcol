# Host CPU, memory, load, paging, network (host_network: true) and uptime.
# No filesystem scraper: inside the add-on container it sees no host partitions.
# /proc inside an add-on reports the whole machine for these scrapers.
receivers:
  host_metrics:
    collection_interval: "${env:SCRAPE_INTERVAL}"
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      network:
        metrics:
          # Needs to walk every host process's sockets; not worth the access.
          system.network.connections:
            enabled: false
      paging: {}
      # system.uptime: machine reboots without a template sensor.
      system:
        metrics:
          system.uptime:
            enabled: true

service:
  pipelines:
    metrics/host:
      receivers: [host_metrics]
      processors: [resource]
      exporters: [otlp_http]
