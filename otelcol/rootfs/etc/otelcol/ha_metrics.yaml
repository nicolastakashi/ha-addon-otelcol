# Home Assistant Core metrics through the Supervisor proxy (homeassistant_api: true).
# Needs the prometheus: integration enabled in Home Assistant. No long-lived token.
receivers:
  prometheus/homeassistant:
    config:
      scrape_configs:
        - job_name: homeassistant
          scrape_interval: "${env:SCRAPE_INTERVAL}"
          metrics_path: /core/api/prometheus
          scheme: http
          authorization:
            credentials: "${env:SUPERVISOR_TOKEN}"
          static_configs:
            - targets: [supervisor]

processors:
  # The prometheus receiver describes the scrape target on the resource; drop it so the
  # metrics share the add-on's resource (service.instance.id comes from the option).
  resource/prometheus:
    attributes:
      - {key: server.address, action: delete}
      - {key: server.port, action: delete}
      - {key: url.scheme, action: delete}
      - {key: service.instance.id, action: delete}

service:
  pipelines:
    metrics/prometheus:
      receivers: [prometheus/homeassistant]
      processors: [resource/prometheus, resource]
      exporters: [otlp_http]
