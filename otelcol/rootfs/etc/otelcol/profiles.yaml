# Experimental (profiles: true). OTel Profiles is alpha everywhere: the protocol,
# the collector support (service.profilesSupport feature gate) and most backends.
# The bundled otel_profiler integration (installed by run.sh) pushes pprof; anything else
# on the host network can send too:
#   pprof:  POST http://127.0.0.1:4040/v1/pprof   (application/octet-stream)
#   OTLP:   http://127.0.0.1:4318                (profiles only)
receivers:
  pprof:
    server:
      endpoint: 127.0.0.1:4040
  otlp/local:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

service:
  pipelines:
    profiles:
      receivers: [pprof, otlp/local]
      processors: [resource/core, resource]
      exporters: [otlp_http]
