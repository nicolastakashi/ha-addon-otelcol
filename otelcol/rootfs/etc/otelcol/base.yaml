# Shared by every feature. Feature fragments add receivers and pipelines.
# The resource processor and exporter headers are generated by run.sh
# from the add-on options (/tmp/generated.yaml).
extensions:
  # Persists the journald cursor and the export queue in the add-on /data.
  file_storage:
    directory: /data/storage
    # The queue database never shrinks on its own after an outage.
    compaction:
      on_start: true
      on_rebound: true
      directory: /data/storage

exporters:
  otlp_http:
    endpoint: "${env:OTLP_ENDPOINT}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0
    # Batching happens inside the persistent queue (no in-memory batch
    # processor), so a restart does not lose a pending batch.
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      # ponytail: fixed 200 MB cap on disk; make it an option if someone needs more.
      queue_size: 200000000
      batch: {}

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
    # The collector's own metrics endpoint would bind :8888 on the host
    # (host_network: true) and clash with anything already there.
    metrics:
      level: none
