# Shared by every feature. Feature fragments add receivers and pipelines.
# The resource processor and exporter headers are generated by run.sh
# from the add-on options (/tmp/generated.yaml).
extensions:
  # Persists the journald cursor and the export queue in the add-on /data.
  file_storage:
    directory: /data/storage
    # The queue database never shrinks on its own after an outage.
    compaction:
      on_start: true
      on_rebound: true
      directory: /data/storage

processors:
  # Names each resource after the component it describes, from container.name (pipelines
  # that mix components: journal logs, entity + container metrics). Home Assistant Core is
  # the service_name option, the Supervisor "supervisor", an add-on its slug, any other
  # Supervisor container its name without "hassio_", the host (no container.name) "haos".
  transform/service:
    error_mode: ignore
    log_statements: &service_statements
      - context: resource
        statements:
          - set(attributes["service.name"], "haos") where attributes["container.name"] == nil
          - set(attributes["service.version"], "${env:OS_VERSION}") where attributes["container.name"] == nil and "${env:OS_VERSION}" != ""
          - set(attributes["service.name"], attributes["container.name"]) where attributes["container.name"] != nil
          - replace_pattern(attributes["service.name"], "^(addon|hassio)_", "") where attributes["container.name"] != nil
          - set(attributes["service.name"], "${env:SERVICE_NAME}") where attributes["container.name"] == "homeassistant"
          - set(attributes["service.version"], "${env:HA_VERSION}") where attributes["container.name"] == "homeassistant" and "${env:HA_VERSION}" != ""
    metric_statements: *service_statements

exporters:
  otlp_http:
    endpoint: "${env:OTLP_ENDPOINT}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0
    # Batching happens inside the persistent queue (no in-memory batch
    # processor), so a restart does not lose a pending batch.
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      # ponytail: fixed 200 MB cap on disk; make it an option if someone needs more.
      queue_size: 200000000
      batch: {}

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
    # The collector's own metrics endpoint would bind :8888 on the host
    # (host_network: true) and clash with anything already there.
    metrics:
      level: none
