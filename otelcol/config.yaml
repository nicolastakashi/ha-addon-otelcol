name: OTel Collector (community)
version: "0.17.1"
slug: otelcol
description: Community add-on with a purpose-built OpenTelemetry Collector that ships HAOS logs, automation traces, Home Assistant metrics and host metrics over OTLP. Not affiliated with the OpenTelemetry project.
url: https://github.com/nicolastakashi/ha-addon-otelcol
# Prebuilt by CI (.github/workflows/builder.yaml). Remove this line to build locally.
image: ghcr.io/nicolastakashi/{arch}-addon-otelcol
arch:
  - amd64
  - aarch64
init: false
startup: services
# journald: read the HAOS system journal (host, Supervisor, Core, every add-on).
journald: true
# homeassistant_api: scrape Core /api/prometheus through the Supervisor proxy, no long-lived token.
homeassistant_api: true
# hassio_api: read the machine host name (/host/info) for host.name.
hassio_api: true
# manager: read the resource usage of Core, the Supervisor and add-ons (container_metrics).
hassio_role: manager
# host_network: hostmetrics sees the real network interfaces.
host_network: true
# homeassistant_config: profiles and core_logs install the bundled integrations into custom_components.
map:
  - type: homeassistant_config
    read_only: false
  # otlp_ca_file: a custom CA certificate from the Home Assistant ssl folder.
  - type: ssl
    read_only: true
options:
  otlp_endpoint: ""
  otlp_protocol: http
  otlp_headers: []
  otlp_tls_insecure_skip_verify: false
  service_name: homeassistant
  deployment_environment: home
  resource_attributes: []
  logs: true
  logs_min_priority: info
  logs_min_severity: info
  logs_multiline: true
  logs_parse: false
  ha_metrics: false
  ha_traces: true
  host_metrics: true
  container_metrics: true
  entity_metrics: true
  entity_metrics_attributes: true
  entity_metrics_attribute_exclude:
    - "supported_features"
    - "min"
    - "max"
    - "min_*"
    - "max_*"
    - "*step"
    - "current"
    - "display_precision"
    - "latitude"
    - "longitude"
    - "altitude"
    - "gps_accuracy"
    - "radius"
  entity_metrics_exclude: []
  event_logs: true
  event_logs_exclude:
    - state_changed
  core_logs: false
  health_sensors: true
  profiles: false
  scrape_interval: 60s
schema:
  otlp_endpoint: str
  otlp_protocol: list(http|grpc)
  otlp_headers:
    - name: str
      value: password
  otlp_tls_insecure_skip_verify: bool
  otlp_ca_file: str?
  service_name: str
  service_instance_id: str?
  deployment_environment: str
  resource_attributes:
    - name: str
      value: str
  logs: bool
  logs_min_priority: list(emerg|alert|crit|err|warning|notice|info|debug)
  logs_min_severity: list(debug|info|warn|error|fatal)
  logs_multiline: bool
  logs_parse: bool
  ha_metrics: bool
  ha_traces: bool
  host_metrics: bool
  container_metrics: bool
  entity_metrics: bool
  entity_metrics_attributes: bool
  entity_metrics_attribute_exclude:
    - str
  entity_metrics_exclude:
    - str
  event_logs: bool
  event_logs_exclude:
    - str
  core_logs: bool
  health_sensors: bool
  profiles: bool
  scrape_interval: match(^[1-9][0-9]*(s|m)$)
