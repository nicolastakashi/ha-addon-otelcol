name: Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./otelcol

  semconv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Weaver registry check
        run: |
          curl -fsSL https://github.com/open-telemetry/weaver/releases/download/v0.23.0/weaver-x86_64-unknown-linux-gnu.tar.xz | tar xJ --strip-components=1 -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/weaver" registry check -r model --future

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otelcol/collector/receiver/homeassistantreceiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: otelcol/collector/receiver/homeassistantreceiver/go.mod
          cache-dependency-path: otelcol/collector/receiver/homeassistantreceiver/go.sum
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Journald traceback recombine check
        working-directory: otelcol/tests/recombine
        run: go test ./...
      - name: OTel Profiler integration self-check (pprof readable by go tool pprof)
        working-directory: .
        run: |
          python3 -I otelcol/tests/profiler_check.py "$RUNNER_TEMP/p.pb.gz"
          go tool pprof -traces "$RUNNER_TEMP/p.pb.gz" | grep -q busy_marker

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(yq -r .version otelcol/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image name matches config.yaml: ghcr.io/<owner>/{arch}-addon-otelcol:<version>
      - uses: docker/build-push-action@v6
        with:
          context: otelcol
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-otelcol:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-otelcol:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
