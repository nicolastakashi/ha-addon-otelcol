groups:
  - id: registry.homeassistant
    type: attribute_group
    display_name: Home Assistant run attributes
    brief: An automation or script run read from Home Assistant's trace store.
    attributes:
      - id: homeassistant.domain
        type: string
        stability: development
        brief: Domain of the item that ran.
        examples: [automation, script]
      - id: homeassistant.item_id
        type: string
        stability: development
        brief: Id of the automation or script inside its domain.
        examples: ["1712345678901", piscina_ligar]
      - id: homeassistant.run_id
        type: string
        stability: development
        brief: Id of the run in the trace store.
        examples: [6a1f0c2e9b8d4f7a]
      - id: homeassistant.alias
        type: string
        stability: development
        brief: Human name of the automation or script.
        examples: [Piscina]
      - id: homeassistant.trigger
        type: string
        stability: development
        brief: Description of what triggered the run.
        examples: ["time pattern"]
      - id: homeassistant.script_execution
        type: string
        stability: development
        brief: How the run ended.
        examples: [finished, failed_conditions, error, cancelled]
      - id: homeassistant.context.id
        type: string
        stability: development
        brief: Home Assistant context id of the run (a ULID, also used as the trace id).
        examples: [01KAV3RQ5Y2G3H4J5K6M7N8P9Q]
      - id: homeassistant.context.parent_id
        type: string
        stability: development
        brief: Context id of the event or run that caused this run.
        examples: [01KAV3RQ5Y2G3H4J5K6M7N8P9R]
      - id: homeassistant.last_step
        type: string
        stability: development
        brief: Path of the last step the run reached.
        examples: [action/2]
      - id: homeassistant.step.result
        type: template[string]
        stability: development
        brief: Scalar values of the step result, one attribute per key (a condition's `result`, an action's `running_script`...).
        note: Values keep their type (boolean, double or string); nested values such as service parameters are not recorded.
        examples: ["true"]
      - id: homeassistant.step.variables
        type: template[string]
        stability: development
        brief: Scalar variables the step changed, one attribute per variable.
        note: Nested values (the trigger object, service data) are not recorded.
        examples: ["on"]
      - id: homeassistant.step.path
        type: string
        stability: development
        brief: Path of the step in the automation or script config.
        examples: [action/1/if/condition/0]
      - id: homeassistant.step.child
        type: string
        stability: development
        brief: Run started by the step, as domain.item_id/run_id.
        examples: [script.rega/6a1f0c2e9b8d4f7a]

  - id: span.homeassistant.run
    type: span
    span_kind: internal
    stability: development
    brief: An automation or script run (root span).
    note: Named `automation <alias>` or `script <alias>`.
    attributes:
      - ref: homeassistant.domain
        requirement_level: required
      - ref: homeassistant.item_id
        requirement_level: required
      - ref: homeassistant.run_id
        requirement_level: required
      - ref: homeassistant.alias
        requirement_level: recommended
      - ref: homeassistant.trigger
        requirement_level: recommended
      - ref: homeassistant.script_execution
        requirement_level: recommended
      - ref: homeassistant.context.id
        requirement_level: recommended
      - ref: homeassistant.context.parent_id
        requirement_level: recommended
      - ref: homeassistant.last_step
        requirement_level: recommended
      - ref: user.id
        requirement_level:
          conditionally_required: When a user started the run.
        brief: Home Assistant user id that started the run.

  - id: span.homeassistant.step
    type: span
    span_kind: internal
    stability: development
    brief: One step of a run (trigger, condition, action...).
    note: 'Named `<kind> <index>: <alias or type>`, e.g. `action 2: Ligar resistência`.'
    attributes:
      - ref: homeassistant.step.path
        requirement_level: required
      - ref: homeassistant.step.result
        requirement_level: recommended
      - ref: homeassistant.step.variables
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: When the step failed (always _OTHER; Home Assistant gives no error class).
      - ref: homeassistant.step.child
        requirement_level:
          conditionally_required: When the step started a script or automation run.

  - id: registry.homeassistant.entity
    type: attribute_group
    display_name: Home Assistant entity attributes
    brief: Entity, device, area and floor context on entity metrics.
    attributes:
      - id: homeassistant.entity.id
        type: string
        stability: development
        brief: Entity id.
        examples: [sensor.sala_temperature]
      - id: homeassistant.entity.domain
        type: string
        stability: development
        brief: Entity domain.
        examples: [sensor, switch]
      - id: homeassistant.entity.name
        type: string
        stability: development
        brief: Friendly name of the entity.
        examples: [Sala temperature]
      - id: homeassistant.entity.device_class
        type: string
        stability: development
        brief: Device class of the entity.
        examples: [temperature, power]
      - id: homeassistant.entity.platform
        type: string
        stability: development
        brief: Integration that provides the entity.
        examples: [zha, shelly]
      - id: homeassistant.device.name
        type: string
        stability: development
        brief: Name of the device the entity belongs to.
        examples: [Termometro sala]
      - id: homeassistant.device.manufacturer
        type: string
        stability: development
        brief: Device manufacturer.
        examples: [Aqara]
      - id: homeassistant.device.model
        type: string
        stability: development
        brief: Device model.
        examples: [T1]
      - id: homeassistant.entity.state
        type: string
        stability: development
        brief: Text state of the entity, on homeassistant.entity.state.
        examples: [heat, home, playing]
      - id: homeassistant.area.name
        type: string
        stability: development
        brief: Area of the entity, or of its device.
        examples: [Sala]
      - id: homeassistant.floor.name
        type: string
        stability: development
        brief: Floor of the area.
        examples: [Rés-do-chão]

  - id: metric.homeassistant.entity.available
    type: metric
    metric_name: homeassistant.entity.available
    instrument: gauge
    unit: "1"
    stability: development
    brief: 0 when the entity is unavailable, else 1.
    note: >
      Entity values use the same attributes: `homeassistant.sensor.<device_class>` (numeric
      sensors, unit from the entity), `homeassistant.<domain>.value` (other numeric
      entities) and `homeassistant.<domain>.on` (1/0 for on/off entities).
    attributes:
      - ref: homeassistant.entity.id
        requirement_level: required
      - ref: homeassistant.entity.domain
        requirement_level: required
      - ref: homeassistant.entity.name
        requirement_level: recommended
      - ref: homeassistant.entity.device_class
        requirement_level: recommended
      - ref: homeassistant.entity.platform
        requirement_level: recommended
      - ref: homeassistant.device.name
        requirement_level: recommended
      - ref: homeassistant.device.manufacturer
        requirement_level: recommended
      - ref: homeassistant.device.model
        requirement_level: recommended
      - ref: homeassistant.area.name
        requirement_level: recommended
      - ref: homeassistant.floor.name
        requirement_level: recommended

  - id: metric.homeassistant.entity.state
    type: metric
    metric_name: homeassistant.entity.state
    instrument: gauge
    unit: "1"
    stability: development
    brief: 1 for the entity's current text state (one series per state value).
    note: Numeric states use homeassistant.sensor.<device_class> or homeassistant.<domain>.value instead; numeric state attributes are homeassistant.<domain>.attribute.<name>.
    attributes:
      - ref: homeassistant.entity.id
        requirement_level: required
      - ref: homeassistant.entity.state
        requirement_level: required

  - id: metric.homeassistant.entity.last_updated
    type: metric
    metric_name: homeassistant.entity.last_updated
    instrument: gauge
    unit: s
    stability: development
    brief: Unix time of the entity's last state update.
    attributes:
      - ref: homeassistant.entity.id
        requirement_level: required
      - ref: homeassistant.entity.domain
        requirement_level: required

  - id: metric.homeassistant.core.up
    type: metric
    metric_name: homeassistant.core.up
    instrument: gauge
    unit: "1"
    stability: development
    brief: 1 when Home Assistant Core answered the WebSocket API at this scrape, else 0.

  - id: registry.homeassistant.event
    type: attribute_group
    display_name: Home Assistant event attributes
    brief: Bus events sent as log records.
    attributes:
      - id: homeassistant.event.type
        type: string
        stability: development
        brief: Event type.
        examples: [call_service, automation_triggered]
      - id: homeassistant.event.origin
        type: string
        stability: development
        brief: Where the event was fired.
        examples: [LOCAL, REMOTE]
      - id: homeassistant.event.data
        type: template[string]
        stability: development
        brief: Event data, one attribute per key; nested values are JSON.
        examples: ['{"entity_id":"switch.bomba"}']

  - id: attributes.homeassistant.event
    type: attribute_group
    brief: Attributes of every Home Assistant event record.
    attributes:
      - ref: homeassistant.event.type
        requirement_level: required
      - ref: homeassistant.event.origin
        requirement_level: recommended
      - ref: homeassistant.event.data
        requirement_level: recommended
      - ref: homeassistant.context.id
        requirement_level: recommended
      - ref: homeassistant.context.parent_id
        requirement_level: recommended
      - ref: user.id
        requirement_level:
          conditionally_required: When a user caused the event.

  - id: event.homeassistant.call_service
    type: event
    name: homeassistant.call_service
    stability: development
    brief: A service (action) was called.
    note: Every Home Assistant event type is sent as `homeassistant.<event_type>`; the trace id comes from the event's context id.
    extends: attributes.homeassistant.event

  - id: event.homeassistant.automation_triggered
    type: event
    name: homeassistant.automation_triggered
    stability: development
    brief: An automation was triggered.
    note: Every Home Assistant event type is sent as `homeassistant.<event_type>`; the trace id comes from the event's context id.
    extends: attributes.homeassistant.event

  - id: event.homeassistant.script_started
    type: event
    name: homeassistant.script_started
    stability: development
    brief: A script started.
    note: Every Home Assistant event type is sent as `homeassistant.<event_type>`; the trace id comes from the event's context id.
    extends: attributes.homeassistant.event

  - id: event.homeassistant.homeassistant_start
    type: event
    name: homeassistant.homeassistant_start
    stability: development
    brief: Home Assistant is starting.
    note: Every Home Assistant event type is sent as `homeassistant.<event_type>`; the trace id comes from the event's context id.
    extends: attributes.homeassistant.event

  - id: event.homeassistant.homeassistant_stop
    type: event
    name: homeassistant.homeassistant_stop
    stability: development
    brief: Home Assistant is stopping.
    note: Every Home Assistant event type is sent as `homeassistant.<event_type>`; the trace id comes from the event's context id.
    extends: attributes.homeassistant.event
